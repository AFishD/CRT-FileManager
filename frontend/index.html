<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="CRT File Manager - A retro CRT-style file manager">
  <title>CRT File Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }
    
    #app {
      width: 100vw;
      height: 100vh;
    }

    /* 启动加载屏 - 在Vue挂载前显示 */
    .boot-screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    .boot-screen .cursor {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 启动画面 - Vue挂载后自动被替换 -->
    <div class="boot-screen">
      <span>INITIALIZING<span class="cursor">_</span></span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
